 "Electrical and Driver Units", "file": "section-pdfs/atlas-204r-itps-parts/09-electrical-driver-units.pdf", "pages": "89-106"}, {"title": "Accessories and Optional Units", "file": "section-pdfs/atlas-204r-itps-parts/10-accessories-optional-units.pdf", "pages": "107-114"}]}};

const manualKey=params.get("manual")||"maintenance";
const manual=manuals[manualKey]||manuals.maintenance;
let sectionIndex=Number.parseInt(params.get("section"),10);
if(!Number.isFinite(sectionIndex)||sectionIndex<0||sectionIndex>=manual.sections.length)sectionIndex=0;
const section=manual.sections[sectionIndex];
document.documentElement.lang=manual.language==="Español"?"es":"en";
document.title=manual.title+" - Ishida Bagger Manuals";
document.getElementById("manual-title").textContent=manual.title;
document.getElementById("current-section").textContent=`${String(sectionIndex+1).padStart(2,"0")}. ${section.title} · Original pages ${section.pages}`;
const list=document.getElementById("section-list");
manual.sections.forEach((item,index)=>{
 const a=document.createElement("a");
 a.className="section-link"+(index===sectionIndex?" active":"");
 a.href=`viewer.html?manual=${encodeURIComponent(manualKey)}&section=${index}`;
 const n=document.createElement("span");n.className="section-number";n.textContent=String(index+1).padStart(2,"0");

 a.append(n,label);list.appendChild(a);
});
